<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Test — Voice Service (Ornith 1.5 35B)</title>
  <style>
    :root { --bg:#0f1220; --card:#1a1f35; --accent:#5b8cff; --txt:#e8ecf8; --muted:#9aa3c0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
           background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; background:var(--card); border-bottom:1px solid #2a3155; }
    header h1 { margin:0; font-size:18px; }
    header small { color:var(--muted); }
    #log { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:78%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
    .bot  { align-self:flex-start; background:var(--card); border:1px solid #2a3155; border-bottom-left-radius:4px; }
    .bot .cursor { display:inline-block; width:8px; height:1em; background:var(--accent);
                  margin-left:2px; vertical-align:-2px; animation:blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    footer { display:flex; gap:10px; padding:14px 20px; background:var(--card); border-top:1px solid #2a3155; }
    #input { flex:1; resize:none; height:48px; padding:12px 14px; border-radius:10px; border:1px solid #2a3155;
             background:#0f1220; color:var(--txt); font-size:15px; }
    button { padding:0 20px; border:none; border-radius:10px; background:var(--accent); color:#fff;
             font-size:15px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .meta { color:var(--muted); font-size:12px; padding:0 20px 6px; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AI Test — Voice Service</h1>
    <small>LLM: <span id="model">…</span> · streaming SSE · STT→LLM→TTS (sẵn sàng tích hợp)</small>
  </header>
  <div class="meta" id="meta">Đang kết nối…</div>
  <div id="log"></div>
  <footer>
    <textarea id="input" placeholder="Nhập câu hỏi cho sếp test… (Enter để gửi)"></textarea>
    <button id="send">Gửi</button>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const meta = document.getElementById('meta');
    const modelEl = document.getElementById('model');
    let sessionId = 'boss-' + Math.random().toString(36).slice(2, 9);

    function addMsg(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function loadHealth() {
      try {
        const r = await fetch('/health');
        const j = await r.json();
        modelEl.textContent = j.ai?.model || 'n/a';
        meta.textContent = `STT: ${j.stt?.ready ? 'sẵn sàng' : 'thiếu model'} · TTS: ${j.tts?.engine || 'n/a'} · LLM: ${j.ai?.url || ''}`;
      } catch (e) { meta.textContent = 'Không lấy được /health: ' + e; }
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg('user', text);
      const botEl = addMsg('bot', '');
      const cursor = document.createElement('span'); cursor.className = 'cursor';
      botEl.appendChild(cursor);

      sendBtn.disabled = true;
      try {
        const resp = await fetch('/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId, stream: true }),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') { cursor.remove(); continue; }
            if (payload.startsWith('event: error')) continue;
            cursor.remove();
            botEl.textContent += payload;
            botEl.appendChild(cursor);
            log.scrollTop = log.scrollHeight;
          }
        }
        cursor.remove();
      } catch (e) {
        botEl.textContent = '[lỗi] ' + e;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    loadHealth();
    input.focus();
  </script>
</body>
</html>
